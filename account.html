<!DOCTYPE html>
<html>
<head>

  <meta charset="utf-8">

  <title>Drissnow - Account</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    href="style/main.css"
    rel="stylesheet"
    type="text/css"
  >

  <style>

    body {
      margin: 0;
    }

    .account-page {
      width: 100%;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .account-card {
      background: #faf8ef;
      color: #776e65;
      border-radius: 8px;
      padding: 25px;
      box-sizing: border-box;
      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.15);
    }

    .account-page-title {
      margin: 0 0 25px;
      text-align: center;
      font-size: 36px;
    }

    .account-details {
      margin-top: 5px;
    }

    .account-detail {
      padding: 15px 0;
      border-bottom:
        1px solid #ddd;
    }

    .account-detail-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      color: #999;
    }

    .account-detail-value {
      display: block;
      font-size: 16px;
      word-break: break-word;
    }

    .account-detail-object {
      margin: 8px 0 0;
      padding: 12px;
      background: #eee;
      border-radius: 5px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #555;
      box-sizing: border-box;
    }

    .balance-detail {
      margin: 25px 0;
      padding: 22px;
      border-radius: 8px;
      background: #edc53f;
      color: #776e65;
      text-align: center;
    }

    .balance-label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .balance-value {
      display: block;
      margin-top: 6px;
      font-size: 40px;
      line-height: 1;
      font-weight: bold;
    }

    .balance-unit {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .balance-source {
      display: block;
      margin-top: 7px;
      font-size: 10px;
      opacity: 0.7;
    }

    .account-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .account-action {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
    }

    .back-button {
      background: #8f7a66;
      color: #f9f6f2;
    }

    .signout-button {
      background: #bbada0;
      color: #fff;
    }

    .account-action:hover {
      opacity: 0.85;
    }

    .account-action:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .account-message {
      min-height: 20px;
      margin: 20px 0 0;
      text-align: center;
      font-size: 13px;
    }

    .account-message.error {
      color: #b33a3a;
    }

    .account-message.success {
      color: #5b7f3a;
    }

    .account-message.loading {
      color: #999;
    }

    .loading {
      opacity: 0.7;
    }

    .account-loading {
      text-align: center;
      padding: 10px 0;
      color: #999;
      font-size: 13px;
    }

    @media screen and (max-width: 520px) {

      .account-page {
        margin: 20px auto;
        padding: 12px;
      }

      .account-card {
        padding: 20px;
      }

      .account-page-title {
        font-size: 30px;
      }

      .account-actions {
        flex-direction: column;
      }

      .account-action {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <div class="account-page">

    <div class="account-card">


      <h1 class="account-page-title">
        Your Account
      </h1>


      <div
        id="account-details"
        class="account-details"
      >

        <div class="account-loading">
          Loading account information...
        </div>

      </div>


      <!--
        Economy balance.

        The value is populated by account.js
        from DrissnowCreditEconomy.
      -->

      <div class="balance-detail">

        <span class="balance-label">
          Account Balance
        </span>


        <span
          id="account-balance"
          class="balance-value loading"
        >
          ...
        </span>


        <span class="balance-unit">
          PEANUT UNITS
        </span>


        <span class="balance-source">
          Live economy balance
        </span>

      </div>


      <div class="account-actions">

        <a
          href="index.html"
          class="account-action back-button"
        >
          BACK TO GAME
        </a>


        <button
          id="signout-button"
          class="account-action signout-button"
          type="button"
        >
          SIGN OUT
        </button>

      </div>


      <p
        id="account-message"
        class="account-message"
      ></p>


    </div>

  </div>


  <!--
    ==================================================
    EXTERNAL JAVASCRIPT ONLY
    ==================================================

    economy_chart.js:
      Provides DrissnowCreditEconomy.

    account.js:
      Contains ALL account/auth/economy logic.
    ==================================================
  -->

  <script src="js/economy_chart.js"></script>
  <script src="js/account.js"></script>


</body>
</html>
